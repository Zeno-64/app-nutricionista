# Configuração do Supabase local (CLI). O projeto hospedado fica na região de
# São Paulo (sa-east-1), escolhida no painel — ver docs/requisitos.md, RNF-04.

project_id = "app-nutricionista"

[api]
enabled = true
port = 54321
schemas = ["public"]
# O schema "app" guarda funções de RLS e auditoria e não é exposto na API.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Exames em PDF e fotos de evolução (RF-14, RF-15).
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "appnutricionista://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true

[inbucket]
enabled = true
port = 54324
